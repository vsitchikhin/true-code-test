services:
  db:
    image: postgres:15-alpine
    container_name: true_code_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db:/var/lib/postgresql/data

  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: true_code_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_HOST=${DB_HOST}
      - DATABASE_PORT=${DB_PORT}
      - DATABASE_USER=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    volumes:
      - ./back:/usr/src/app
      - /usr/src/app/node_modules
      - ./back/uploads:/usr/src/app/uploads

  app:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: true_code_app
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db:
